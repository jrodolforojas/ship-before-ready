<!doctype html>
<html lang="[[lang]]">
<head>
<meta charset="utf-8">
<title>[[name]] · [[frame.width]]</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="[[fonts.href]]" rel="stylesheet">
<style>
body{margin:0}
[[> tokens.css]]
</style>
</helmet>
<div class="sbr" data-sbr="page" data-composition="[[composition]]" data-scheme="[[scheme]]" data-decor="[[decor]]" data-screen="1" style="box-sizing: border-box; width: 1440px; min-height: [[frame.height]]px; display: flex; flex-direction: column; background: var(--color-canvas); color: var(--color-ink); font-family: var(--font-body)">
<section data-sbr="screen-promise" style="display: flex; flex-direction: column; box-sizing: border-box; width: 100%; max-width: var(--container-page); margin: 0 auto; padding: 0 var(--spacing-block)">
<header style="padding: var(--spacing-group) 0; border-bottom: var(--line-width) solid var(--color-line)">
<p data-sbr="brand" style="margin: 0; font-family: var(--font-body); font-size: var(--text-button); line-height: var(--text-button--line-height); font-weight: var(--text-button--font-weight); letter-spacing: var(--text-button--letter-spacing); color: var(--color-ink)">[[copy.brand]]</p>
</header>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: var(--spacing-block); padding: var(--spacing-section) 0">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--spacing-group); min-width: 0; max-width: var(--container-prose); font-size: var(--text-body)">
<div style="display: flex; flex-direction: column; gap: var(--spacing-item)">
<h1 data-sbr="title" style="margin: 0; font-family: var(--font-display); font-size: var(--text-title); line-height: var(--text-title--line-height); font-weight: var(--text-title--font-weight); letter-spacing: var(--text-title--letter-spacing); color: var(--color-ink); text-wrap: balance">[[copy.hero.title]]</h1>
<p data-sbr="subtitle" style="margin: 0; font-family: var(--font-body); font-size: var(--text-lead); line-height: var(--text-lead--line-height); font-weight: var(--text-lead--font-weight); letter-spacing: var(--text-lead--letter-spacing); color: var(--color-ink-muted)">[[copy.hero.subtitle]]</p>
</div>
<button data-sbr="cta" type="button" style="display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: var(--spacing-block); margin: 0; padding: var(--spacing-item) var(--spacing-group); border: 0; border-radius: var(--radius-control); background: var(--color-accent); color: var(--color-on-accent); font-family: var(--font-body); font-size: var(--text-button); line-height: var(--text-button--line-height); font-weight: var(--text-button--font-weight); letter-spacing: var(--text-button--letter-spacing); text-align: center; cursor: pointer">[[copy.cta]]</button>
</div>
[[> figure.html flex: none; width: 25%]]
</div>
<div style="padding: var(--spacing-section) 0; border-top: var(--line-width) solid var(--color-line)">
<ul data-sbr="pains" style="display: flex; flex-direction: column; gap: var(--spacing-group); max-width: var(--container-prose); margin: 0; padding: 0; list-style: none; font-size: var(--text-body)">
[[#each copy.pains]]
<li style="font-family: var(--font-body); font-size: var(--text-body); line-height: var(--text-body--line-height); font-weight: var(--text-body--font-weight); letter-spacing: var(--text-body--letter-spacing); color: var(--color-ink)">[[this]]</li>
[[/each]]
</ul>
</div>
<div style="padding: var(--spacing-section) 0; border-top: var(--line-width) solid var(--color-line)">
<ol data-sbr="steps" style="display: flex; flex-direction: column; gap: var(--spacing-group); max-width: var(--container-prose); margin: 0; padding: 0; list-style: none; font-size: var(--text-body)">
[[#each copy.steps]]
<li style="display: flex; align-items: flex-start; gap: var(--spacing-group)">
<span style="flex: none; width: var(--spacing-block); font-family: var(--font-display); font-size: var(--text-heading); line-height: var(--text-heading--line-height); font-weight: var(--text-heading--font-weight); letter-spacing: var(--text-heading--letter-spacing); color: var(--color-ink)">[[index]]</span>
<span style="font-family: var(--font-body); font-size: var(--text-body); line-height: var(--text-body--line-height); font-weight: var(--text-body--font-weight); letter-spacing: var(--text-body--letter-spacing); color: var(--color-ink)">[[this]]</span>
</li>
[[/each]]
</ol>
</div>
<div style="padding: var(--spacing-section) 0; border-top: var(--line-width) solid var(--color-line)">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--spacing-group); max-width: var(--container-prose); font-size: var(--text-body)">
<h2 data-sbr="closing" style="margin: 0; font-family: var(--font-display); font-size: var(--text-heading); line-height: var(--text-heading--line-height); font-weight: var(--text-heading--font-weight); letter-spacing: var(--text-heading--letter-spacing); color: var(--color-ink); text-wrap: balance">[[copy.closing]]</h2>
<button data-sbr="cta-closing" type="button" style="display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: var(--spacing-block); margin: 0; padding: var(--spacing-item) var(--spacing-group); border: 0; border-radius: var(--radius-control); background: var(--color-accent); color: var(--color-on-accent); font-family: var(--font-body); font-size: var(--text-button); line-height: var(--text-button--line-height); font-weight: var(--text-button--font-weight); letter-spacing: var(--text-button--letter-spacing); text-align: center; cursor: pointer">[[copy.cta]]</button>
</div>
</div>
<footer data-sbr="footer" style="padding: var(--spacing-group) 0 var(--spacing-block); border-top: var(--line-width) solid var(--color-line)">
<div style="display: flex; flex-direction: column; gap: var(--spacing-item); max-width: var(--container-prose); font-size: var(--text-body)">
<p style="margin: 0; font-family: var(--font-body); font-size: var(--text-small); line-height: var(--text-small--line-height); font-weight: var(--text-small--font-weight); letter-spacing: var(--text-small--letter-spacing); color: var(--color-ink-muted)">[[copy.footer.author]]</p>
<p style="margin: 0; font-family: var(--font-body); font-size: var(--text-small); line-height: var(--text-small--line-height); font-weight: var(--text-small--font-weight); letter-spacing: var(--text-small--letter-spacing); color: var(--color-ink-muted)">[[copy.footer.privacy]]</p>
</div>
</footer>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":[[frame.height]]}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
