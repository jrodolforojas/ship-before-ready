<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{title}}</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        line-height: 1.2;
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main data-sbr-probe>
      <h1>{{title}}</h1>
      <p>{{message}}</p>
    </main>
  </body>
</html>
